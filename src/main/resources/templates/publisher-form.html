<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Publisher</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="module-page">
<div th:replace="~{fragments :: topbar}"></div>

<div class="container">

    <div class="card">

        <h1 class="page-title" th:text="${publisher.id == null ? 'Add Publisher' : 'Edit Publisher'}"></h1>

        <form th:action="@{/publishers/save}"
              th:object="${publisher}"
              method="post">

                        <input type="hidden" th:field="*{id}">

            <div class="form-grid">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text"
                           th:field="*{name}"
                           required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           th:field="*{email}">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text"
                           th:field="*{phone}">
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text"
                           th:field="*{address}">
                </div>

            </div>

            <div class="actions">
                <button type="submit" class="btn">
                    SAVE
                </button>

                <a href="/publishers"
                   class="btn btn-secondary">
                    CANCEL
                </a>

                <a href="/" class="back">Back Home</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
