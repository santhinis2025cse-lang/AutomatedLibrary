<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Sales Order Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="module-page">
<div th:replace="~{fragments :: topbar}"></div>
<div class="container">
    <h1 th:text="${salesOrder.id == null ? 'Add Sales Order' : 'Edit Sales Order'}"></h1>
    <form th:action="@{/sales-orders/save}" th:object="${salesOrder}" method="post">
        <input type="hidden" th:field="*{id}" />
        <label>Order Number<input type="text" th:field="*{orderNumber}" required /></label>
        <label>Quantity<input type="number" th:field="*{quantity}" required /></label>
        <label>Amount<input type="number" step="0.01" th:field="*{amount}" required /></label>
        <label>Order Date<input type="date" th:field="*{orderDate}" /></label>
        <label>Status<input type="text" th:field="*{status}" required /></label>
        <label>School District
            <select name="schoolDistrictId" required>
                <option value="" disabled th:selected="${salesOrder.schoolDistrict == null}">Choose a district</option>
                <option th:each="district : ${schoolDistricts}" th:value="${district.id}" th:text="${district.name}" th:selected="${salesOrder.schoolDistrict != null and salesOrder.schoolDistrict.id == district.id}"></option>
            </select>
        </label>
        <label>Product
            <select name="productId" required>
                <option value="" disabled th:selected="${salesOrder.product == null}">Choose a product</option>
                <option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name}" th:selected="${salesOrder.product != null and salesOrder.product.id == product.id}"></option>
            </select>
        </label>
        <button type="submit">Save</button>
        <a class="btn secondary" href="/sales-orders">Cancel</a>
        <a class="back" href="/">Back Home</a>
    </form>
</div>
</body>
</html>
