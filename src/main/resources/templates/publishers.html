<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Publishers</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="module-page">
<div th:replace="~{fragments :: topbar}"></div>

<div class="container">

    <div class="header">
        <div class="logo">Library<br>Management</div>

        <div class="subtitle">
            Manage publishers and their contact information.
        </div>
    </div>

    <p class="message" th:if="${message}" th:text="${message}"></p>
    <p class="message" th:if="${error}" th:text="${error}"></p>

    <div class="card">

        <h2>Add a publisher</h2>

        <form th:action="@{/publishers/save}"
              th:object="${publisher}"
              method="post">

            <div class="form-grid">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text"
                           th:field="*{name}"
                           placeholder="Publisher name"
                           required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           th:field="*{email}"
                           placeholder="Email">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text"
                           th:field="*{phone}"
                           placeholder="Phone">
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text"
                           th:field="*{address}"
                           placeholder="Address">
                </div>

            </div>

            <div class="actions">
                <button type="submit" class="btn">
                    ADD PUBLISHER
                </button>
            </div>

        </form>

    </div>

    <div class="card">

        <h2>Publishers</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>NAME</th>
                    <th>EMAIL</th>
                    <th>PHONE</th>
                    <th>ADDRESS</th>
                    <th>ACTIONS</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="publisher : ${publishers}">

                    <td th:text="${publisher.id}"></td>
                    <td th:text="${publisher.name}"></td>
                    <td th:text="${publisher.email}"></td>
                    <td th:text="${publisher.phone}"></td>
                    <td th:text="${publisher.address}"></td>

                    <td>

                        <a class="btn btn-small"
                           th:href="@{/publishers/edit/{id}(id=${publisher.id})}">
                            UPDATE
                        </a>

                                                <form class="row-actions" method="post"
                                                            th:action="@{/publishers/delete/{id}(id=${publisher.id})}"
                                                            onsubmit="return confirm('Delete publisher?')">
                                                        <button class="btn btn-danger btn-small" type="submit">DELETE</button>
                                                </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(publishers)}">
                    <td colspan="6" class="empty">No publishers available.</td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <a href="/" class="back">Back Home</a>

</div>

</body>
</html>
