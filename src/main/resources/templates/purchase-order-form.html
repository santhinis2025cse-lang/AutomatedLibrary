<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Purchase Order Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="module-page">
<div th:replace="~{fragments :: topbar}"></div>
<div class="container">
    <h1 th:text="${purchaseOrder.id == null ? 'Add Purchase Order' : 'Edit Purchase Order'}"></h1>
    <form th:action="@{/purchase-orders/save}" th:object="${purchaseOrder}" method="post">
        <input type="hidden" th:field="*{id}" />
        <label>PO Number<input type="text" th:field="*{poNumber}" required /></label>
        <label>Status<input type="text" th:field="*{status}" required /></label>
        <label>Quantity<input type="number" th:field="*{quantity}" required /></label>
        <label>Amount<input type="number" step="0.01" th:field="*{amount}" required /></label>
        <label>Order Date<input type="date" th:field="*{orderDate}" /></label>
        <label>Publisher
            <select name="publisherId" required>
                <option value="" disabled th:selected="${purchaseOrder.publisher == null}">Choose a publisher</option>
                <option th:each="publisher : ${publishers}" th:value="${publisher.id}" th:text="${publisher.name}" th:selected="${purchaseOrder.publisher != null and purchaseOrder.publisher.id == publisher.id}"></option>
            </select>
        </label>
        <button type="submit">Save</button>
        <a class="btn secondary" href="/purchase-orders">Cancel</a>
        <a class="back" href="/">Back Home</a>
    </form>
</div>
</body>
</html>
