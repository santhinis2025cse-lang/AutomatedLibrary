<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Product Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="module-page">
<div th:replace="~{fragments :: topbar}"></div>
<div class="container">
    <h1 th:text="${product.id == null ? 'Add Product' : 'Edit Product'}"></h1>
    <form th:action="@{/products/save}" th:object="${product}" method="post">
        <input type="hidden" th:field="*{id}" />
        <label>Name<input type="text" th:field="*{name}" required /></label>
        <label>Type<input type="text" th:field="*{type}" required /></label>
        <label>Description<textarea th:field="*{description}" rows="4"></textarea></label>
        <label>Price<input type="number" step="0.01" th:field="*{price}" required /></label>
        <label>Active<input type="checkbox" th:field="*{active}" /></label>
        <button type="submit">Save</button>
        <a class="btn secondary" href="/products">Cancel</a>
        <a class="back" href="/">Back Home</a>
    </form>
</div>
</body>
</html>
