<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>E-Books</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="module-page">
<div th:replace="~{fragments :: topbar}"></div>

<div class="container">

    <div class="header">
        <div class="logo">Library<br>Management</div>

        <div class="subtitle">
            Keep the collection current, connect every e-book
            to its publisher, and manage licenses easily.
        </div>
    </div>

    <p class="message" th:if="${message}" th:text="${message}"></p>
    <p class="message" th:if="${error}" th:text="${error}"></p>

    <div class="card">

        <h2>Add an e-book</h2>

        <form th:action="@{/ebooks/save}"
              th:object="${ebook}"
              method="post">

            <div class="form-grid">

                <div class="form-group">
                    <label>Book Title</label>
                    <input type="text"
                           th:field="*{title}"
                           placeholder="Enter a title"
                           required>
                </div>

                <div class="form-group">
                    <label>ISBN</label>
                    <input type="text"
                           th:field="*{isbn}"
                           placeholder="ISBN">
                </div>

                <div class="form-group">
                    <label>Genre</label>
                    <input type="text"
                           th:field="*{genre}"
                           placeholder="Programming">
                </div>

                <div class="form-group">
                    <label>Price</label>
                    <input type="number"
                           step="0.01"
                           th:field="*{price}"
                           placeholder="0.00">
                </div>

                <div class="form-group">
                    <label>Publisher</label>

                    <select name="publisherId" required>

                        <option value="">
                            Choose a publisher
                        </option>

                        <option th:each="publisher : ${publishers}"
                                th:value="${publisher.id}"
                                th:text="${publisher.name}">
                        </option>

                    </select>
                </div>

            </div>

            <div class="actions">
                <button type="submit" class="btn">
                    ADD E-BOOK
                </button>

                <a href="/" class="btn btn-secondary">
                    HOME
                </a>
            </div>

        </form>

    </div>


    <div class="card">

        <h2>E-Books</h2>

        <div class="search-row">

            <input type="text"
                   id="search"
                   placeholder="Type part of a title">

            <button class="btn btn-secondary"
                    onclick="showAll()">
                SHOW ALL BOOKS
            </button>

        </div>

        <div class="table-wrapper">

            <table id="ebookTable">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>TITLE</th>
                    <th>ISBN</th>
                    <th>GENRE</th>
                    <th>PRICE</th>
                    <th>PUBLISHER</th>
                    <th>ACTIONS</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="ebook : ${ebooks}">

                    <td th:text="${ebook.id}"></td>

                    <td th:text="${ebook.title}"></td>

                    <td th:text="${ebook.isbn}"></td>

                    <td th:text="${ebook.genre}"></td>

                    <td th:text="${ebook.price}"></td>

                    <td>
                        <span th:if="${ebook.publisher != null}"
                              th:text="${ebook.publisher.name}">
                        </span>

                        <span th:unless="${ebook.publisher != null}">
                            No Publisher
                        </span>
                    </td>

                    <td>

                        <a class="btn btn-small"
                           th:href="@{/ebooks/edit/{id}(id=${ebook.id})}">
                            UPDATE
                        </a>

                                                <form class="row-actions" method="post"
                                                            th:action="@{/ebooks/delete/{id}(id=${ebook.id})}"
                                                            onsubmit="return confirm('Delete this e-book?')">
                                                        <button class="btn btn-danger btn-small" type="submit">DELETE</button>
                                                </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <p class="empty" th:if="${#lists.isEmpty(ebooks)}">No e-books available.</p>

        <a href="/" class="back">Back Home</a>

    </div>

</div>

<script>

function showAll() {
    document.getElementById("search").value = "";
    filterBooks();
}

document.getElementById("search")
    .addEventListener("keyup", filterBooks);

function filterBooks() {

    let value =
        document.getElementById("search")
        .value.toLowerCase();

    let rows =
        document.querySelectorAll("#ebookTable tbody tr");

    rows.forEach(function(row) {

        let title =
            row.children[1].innerText.toLowerCase();

        row.style.display =
            title.includes(value) ? "" : "none";
    });
}

</script>

</body>
</html>
