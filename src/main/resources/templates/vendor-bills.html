<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Vendor Bills</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="module-page">
<div th:replace="~{fragments :: topbar}"></div>
<div class="container">
    <h1>Vendor Bills</h1>
    <a class="btn" href="/vendor-bills/new">Add Vendor Bill</a>
    <a class="btn secondary" href="/">Back Home</a>
    <p class="message" th:if="${message}" th:text="${message}"></p>
    <p class="message" th:if="${error}" th:text="${error}"></p>
    <table>
        <thead>
        <tr><th>ID</th><th>Bill Number</th><th>Amount</th><th>Status</th><th>Payment</th><th>Publisher</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="bill : ${vendorBills}">
            <td th:text="${bill.id}"></td>
            <td th:text="${bill.billNumber}"></td>
            <td th:text="${bill.amount}"></td>
            <td th:text="${bill.status}"></td>
            <td th:text="${bill.paymentStatus}"></td>
            <td th:text="${bill.publisher != null ? bill.publisher.name : 'N/A'}"></td>
            <td>
                <a class="small-btn" th:href="@{'/vendor-bills/edit/' + ${bill.id}}">Edit</a>
                <form class="row-actions" method="post" th:action="@{/vendor-bills/delete/{id}(id=${bill.id})}" onsubmit="return confirm('Delete this vendor bill?')">
                    <button class="btn btn-danger btn-small" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(vendorBills)}"><td colspan="7" class="empty">No vendor bills available.</td></tr>
        </tbody>
    </table>
    <a href="/" class="back">Back Home</a>
</div>
</body>
</html>
