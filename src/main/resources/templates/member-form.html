<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Member</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="module-page">
<div th:replace="~{fragments :: topbar}"></div>

<div class="container">

    <div class="card">

        <h1 class="page-title" th:text="${member.id == null ? 'Add Member' : 'Edit Member'}"></h1>

        <form th:action="@{/members/save}"
              th:object="${member}"
              method="post">

                        <input type="hidden" th:field="*{id}">

            <div class="form-grid">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text"
                           th:field="*{name}"
                           required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           th:field="*{email}">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text"
                           th:field="*{phone}">
                </div>

                <div class="form-group">
                    <label>Membership Start</label>
                    <input type="date" th:field="*{membershipStart}">
                </div>

                <div class="form-group">
                    <label>Membership Expiry</label>
                    <input type="date" th:field="*{membershipExpiry}">
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <input type="text" th:field="*{status}">
                </div>

            </div>

            <div class="actions">

                <button type="submit" class="btn">
                    SAVE
                </button>

                <a href="/members"
                   class="btn btn-secondary">
                    CANCEL
                </a>

                <a href="/" class="back">Back Home</a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
